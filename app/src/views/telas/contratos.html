<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contratos - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="text/css" href="/css/style.css" />
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Gerenciar Contratos</h4>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalNovoContrato">+ Novo Contrato</button>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Valor (R$)</th>
          <th>Descrição</th>
          <th>Visitante</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-contratos"></tbody>
    </table>
  </main>
</div>

<!-- Modal: Novo Contrato -->
<div class="modal fade" id="modalNovoContrato" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Registrar Contrato</h5>

      <input id="contrato-valor" class="form-control mb-2" placeholder="Valor do contrato (R$)" />
      <textarea id="contrato-descricao" class="form-control mb-2" placeholder="Descrição do contrato"></textarea>

      <select id="contrato-visitante" class="form-select mb-3">
        <option value="">Selecione o visitante</option>
      </select>

      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="registrarContrato()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="/js/menu.js"></script>
<script type="text/javascript" src="/js/contratos.js"></script>
</body>
</html>
