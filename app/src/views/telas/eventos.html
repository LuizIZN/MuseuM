<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventos - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="text/css" href="/css/style.css">
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold">Gerenciar Eventos</h4>
      </div>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalCadastrarEvento">
        + Novo Evento
      </button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar evento...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Código do Evento</th>
          <th>Título</th>
          <th>Data</th>
          <th>Horário</th>
          <th>Duração</th>
          <th>Descrição</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-eventos"></tbody>
    </table>

    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
      </ul>
    </nav>
  </main>
</div>

<!-- Modal Cadastrar -->
<div class="modal fade" id="modalCadastrarEvento" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Novo Evento</h5>
      <input id="new-cod" class="form-control mb-2" placeholder="Código do Evento">
      <input id="new-diretor" class="form-control mb-2" placeholder="Diretor">
      <input id="new-titulo" class="form-control mb-2" placeholder="Título do Evento">
      <input id="new-data" class="form-control mb-2" placeholder="Data">
      <input id="new-horario" class="form-control mb-2" placeholder="Horário">
      <input id="new-coordenador" class="form-control mb-2" placeholder="Coordenador">
      <input id="new-duracao" class="form-control mb-2" placeholder="Duração">
      <input id="new-descricao" class="form-control mb-3" placeholder="Descrição">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="salvarNovoEvento()">Cadastrar Evento</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Editar -->
<div class="modal fade" id="modalEditarEvento" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Editar Evento</h5>
      <input id="edit-cod" class="form-control mb-2" placeholder="Código do Evento">
      <input id="edit-diretor" class="form-control mb-2" placeholder="Diretor">
      <input id="edit-titulo" class="form-control mb-2" placeholder="Título do Evento">
      <input id="edit-data" class="form-control mb-2" placeholder="Data">
      <input id="edit-horario" class="form-control mb-2" placeholder="Horário">
      <input id="edit-coordenador" class="form-control mb-2" placeholder="Coordenador">
      <input id="edit-duracao" class="form-control mb-2" placeholder="Duração">
      <input id="edit-descricao" class="form-control mb-3" placeholder="Descrição">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="salvarEdicaoEvento()">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="/js/menu.js"></script>
<script type="text/javascript" src="/js/eventos.js"></script>
</body>
</html>
