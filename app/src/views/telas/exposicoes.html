<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exposições - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Gerenciar Exposições</h4>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalNovaExposicao">+ Nova Exposição</button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar exposição...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Dias</th>
          <th>Descrição</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-exposicoes"></tbody>
    </table>

    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
      </ul>
    </nav>
  </main>
</div>

<!-- Modal: Nova Exposição -->
<div class="modal fade" id="modalNovaExposicao" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Nova Exposição</h5>
      <input id="nova-titulo" class="form-control mb-2" placeholder="Título">
      <input id="nova-dias" class="form-control mb-2" placeholder="Dias (ex: Seg a Sex)">
      <textarea id="nova-descricao" class="form-control mb-3" placeholder="Descrição"></textarea>
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="cadastrarExposicao()">Cadastrar Exposição</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Editar Exposição -->
<div class="modal fade" id="modalEditarExposicao" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Editar Exposição</h5>
      <input id="edit-titulo" class="form-control mb-2" placeholder="Título">
      <input id="edit-dias" class="form-control mb-2" placeholder="Dias">
      <textarea id="edit-descricao" class="form-control mb-3" placeholder="Descrição"></textarea>
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="salvarEdicaoExposicao()">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
<script src="js/exposicoes.js"></script>
</body>
</html>
