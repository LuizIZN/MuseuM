<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Funcionários - MuseuM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="text/css" href="/css/style.css" />
  </head>
  <body>
    <div class="d-flex vh-100">
      <!-- Sidebar -->
      <aside
        class="bg-white border-end p-4 d-flex flex-column justify-content-between"
        style="width: 250px"
      >
        <div>
          <h4 class="fw-bold mb-4 text-center">
            Museu<span class="text-dark">M</span>
          </h4>
          <p class="text-muted fw-semibold mb-2">Menu</p>
          <ul id="menu-list" class="nav flex-column gap-1"></ul>
        </div>
      </aside>

      <!-- Conteúdo Principal -->
      <main class="flex-fill p-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 id="user-greeting" class="fw-bold"></h4>
            <p class="text-muted">
              Gerencie os dados dos funcionários cadastrados
            </p>
          </div>
          <button
            class="btn btn-outline-dark"
            data-bs-toggle="modal"
            data-bs-target="#modalCadastrar"
          >
            + Novo Funcionário
          </button>
        </div>

        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            id="input-busca"
            placeholder="🔍 Buscar funcionário..."
          />
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Função</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabela-funcionarios"></tbody>
        </table>

        <nav class="d-flex justify-content-center mt-4">
          <ul class="pagination pagination-sm">
            
          </ul>
        </nav>
      </main>
    </div>

    <!-- MODAL Cadastrar -->
    <div class="modal fade" id="modalCadastrar" tabindex="-1">
      <div class="modal-dialog">
        <form onsubmit="cadastrar()" id="form-cadastro" class="modal-content p-4">
          <h5 class="modal-title mb-3">Cadastrar Funcionário</h5>
          <input class="form-control mb-2" name="nome" placeholder="Nome" required />
          <input class="form-control mb-2" name="email" placeholder="Email" required />
          <input class="form-control mb-2" type="password" name="senha" placeholder="Senha" required />
          <input class="form-control mb-2" type="password" name="confirmarSenha" placeholder="Confirmar Senha" required />
          <select class="form-control mb-2" name="funcao" id="funcao" required>
            <option disabled selected>Função</option>
            <option value="gerente">Gerente</option>
            <option value="diretor">Diretor</option>
            <option value="atendente">Atendente</option>
          </select>
          <div class="text-end">
            <button
              class="btn btn-outline-secondary me-2"
              data-bs-dismiss="modal"
              type="reset"
            >
              Fechar
            </button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL Editar -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog">
        <form onsubmit="editar()" id="form-editar" class="modal-content p-4">
          <h5 class="modal-title mb-3">Editar Funcionário</h5>
          <input class="form-control mb-2" id="nome" placeholder="Nome" required />
          <input class="form-control mb-2" id="email" placeholder="Email" required />
          <div class="text-end">
            <button
              class="btn btn-outline-secondary me-2"
              data-bs-dismiss="modal"
              type="reset"
            >
              Fechar
            </button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/js/menu.js"></script>
    <script type="text/javascript" src="/js/funcionarios.js"></script>
  </body>
</html>
