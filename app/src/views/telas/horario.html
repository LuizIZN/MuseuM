<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horário de Funcionamento - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="flex-fill p-4 overflow-auto">
    <h4 class="fw-bold mb-4">Horário de Funcionamento</h4>

    <div class="card shadow-sm p-4 mb-4">
      <h6 class="mb-3 text-muted">Horário Atual</h6>
      <p><strong>Dias:</strong> <span id="horario-dias">—</span></p>
      <p><strong>Início:</strong> <span id="horario-inicio">—</span></p>
      <p><strong>Fim:</strong> <span id="horario-fim">—</span></p>
    </div>

    <div class="card shadow-sm p-4">
      <h6 class="mb-3">Alterar Horário</h6>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Dias Comerciais</label>
          <input id="input-dias" class="form-control" placeholder="Ex: Seg a Sex" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Hora de Início</label>
          <input id="input-inicio" type="time" class="form-control" />
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Hora de Fim</label>
          <input id="input-fim" type="time" class="form-control" />
        </div>
      </div>

      <div class="text-end">
        <button class="btn btn-primary" onclick="salvarHorario()">Salvar Alterações</button>
      </div>
    </div>
  </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
<script src="js/horario.js"></script>
</body>
</html>
