<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Itens - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="text/css" href="/css/style.css">
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 id="user-greeting" class="fw-bold"></h4>
        <p class="text-muted">Gerencie os itens cadastrados no acervo</p>
      </div>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalCadastrarItem">
        + Novo Item
      </button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar item...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nº Doação</th>
          <th>Nome</th>
          <th>Estado de Conservação</th>
          <th>Classificação</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-itens"></tbody>
    </table>

    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
      </ul>
    </nav>
  </main>
</div>

<!-- MODAL Cadastrar Item -->
<div class="modal fade" id="modalCadastrarItem" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Cadastrar Item</h5>
      <input class="form-control mb-2" placeholder="Código do Item">
      <input class="form-control mb-2" placeholder="Código da Doação">
      <input class="form-control mb-2" placeholder="Matrícula do Gerente">
      <input class="form-control mb-2" placeholder="Nome do Item">
      <input class="form-control mb-2" placeholder="Estado de Conservação">
      <input class="form-control mb-3" placeholder="Classificação">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary">Cadastrar Item</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL Editar Item -->
<div class="modal fade" id="modalEditarItem" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Editar Item</h5>
      <input class="form-control mb-2" placeholder="Código do Item">
      <input class="form-control mb-2" placeholder="Código da Doação">
      <input class="form-control mb-2" placeholder="Matrícula do Gerente">
      <input class="form-control mb-2" placeholder="Nome do Item">
      <input class="form-control mb-2" placeholder="Estado de Conservação">
      <input class="form-control mb-3" placeholder="Classificação">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="/js/menu.js"></script>
<script type="text/javascript" src="/js/itens.js"></script>
</body>
</html>
