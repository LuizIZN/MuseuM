<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Itens - MuseuM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="text/css" href="/css/style.css" />
  </head>
  <body>
    <div class="d-flex vh-100">
      <!-- Sidebar -->
      <aside
        class="bg-white border-end p-4 d-flex flex-column justify-content-between"
        style="width: 250px"
      >
        <div>
          <h4 class="fw-bold mb-4 text-center">
            Museu<span class="text-dark">M</span>
          </h4>
          <p class="text-muted fw-semibold mb-2">Menu</p>
          <ul id="menu-list" class="nav flex-column gap-1"></ul>
        </div>
      </aside>

      <!-- Conteúdo Principal -->
      <main class="flex-fill p-4 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h4 id="user-greeting" class="fw-bold"></h4>
            <p class="text-muted">Gerencie os itens cadastrados no acervo</p>
          </div>
          <button
            class="btn btn-outline-dark"
            data-bs-toggle="modal"
            data-bs-target="#modalCadastrarItem"
          >
            + Novo Item
          </button>
        </div>

        <div class="mb-3">
          <input
            type="text"
            id="input-busca"
            class="form-control"
            placeholder="🔍 Buscar item por nome..."
          />
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nº Doação</th>
              <th>Nome</th>
              <th>Estado de Conservação</th>
              <th>Classificação</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabela-itens"></tbody>
        </table>

        <nav class="d-flex justify-content-center mt-4">
          <ul class="pagination pagination-sm">
            <li class="page-item">
              <a class="page-link" href="#">Anterior</a>
            </li>
            <li class="page-item active">
              <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
          </ul>
        </nav>
      </main>
    </div>

    <!-- MODAL Cadastrar Item -->
    <div
      class="modal fade"
      id="modalCadastrarItem"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog">
        <form
          onsubmit="cadastrar()"
          id="form-cadastro"
          class="modal-content p-4"
        >
          <h5 class="modal-title mb-3">Cadastrar Item</h5>
          <input
            class="form-control mb-2"
            name="codigo"
            placeholder="Código"
            required
          />
          <input
            class="form-control mb-2"
            name="nome"
            placeholder="Nome"
            required
          />
          <select
            class="form-control mb-2"
            name="estado_conservacao"
            id="estado_conservacao"
            required
          >
            <option disabled selected required>Estado de conservação</option>
            <option value="Otimo">Ótimo</option>
            <option value="Bom">Bom</option>
            <option value="Regular">Regular</option>
            <option value="Ruim">Ruim</option>
            <option value="Pessimo">Péssimo</option>
          </select>
          <select
            class="form-control mb-2"
            name="classificacao"
            id="classificacao"
            required
          >
            <option disabled selected>Classificação</option>
            <option value="Acervo">Acervo</option>
            <option value="Patrimonio">Patrimônio</option>
            <option value="Comercio">Comércio</option>
          </select>
          <div class="text-end">
            <button
              class="btn btn-outline-secondary me-2"
              data-bs-dismiss="modal"
              type="reset"
            >
              Fechar
            </button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL Editar Item -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog">
        <form onsubmit="editar()" id="form-editar" class="modal-content p-4">
          <h5 class="modal-title mb-3">Editar Item</h5>
          <input
            class="form-control mb-2"
            name="codigo"
            placeholder="Código"
            required
          />
          <input
            class="form-control mb-2"
            name="nome"
            placeholder="Nome"
            required
          />
          <select
            class="form-control mb-2"
            name="estado_conservacao"
            id="estado_conservacao"
            required
          >
            <option disabled selected required>Estado</option>
            <option value="Otimo">Ótimo</option>
            <option value="Bom">Bom</option>
            <option value="Regular">Regular</option>
            <option value="Ruim">Ruim</option>
            <option value="Pessimo">Péssimo</option>
          </select>
          <select
            class="form-control mb-2"
            name="classificacao"
            id="classificacao"
            required
          >
            <option disabled selected>Classificação</option>
            <option value="Acervo">Acervo</option>
            <option value="Patrimonio">Patrimônio</option>
            <option value="Comercio">Comércio</option>
          </select>
          <div class="text-end">
            <button
              class="btn btn-outline-secondary me-2"
              data-bs-dismiss="modal"
              type="reset"
            >
              Fechar
            </button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="/js/menu.js"></script>
    <script type="text/javascript" src="/js/itens.js"></script>
  </body>
</html>
