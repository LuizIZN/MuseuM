<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuseuM Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="text/css" href="/css/style.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100 bg-light">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
    <h1 class="text-center fw-bold mb-4">Museu<span class="text-dark fw-bolder">M</span></h1>

    <form>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="Senha" required>
      </div>
      <div class="d-grid">
        <button onclick="login()" class="btn btn-primary btn-login">Login</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <a href="#" class="text-primary small">Esqueci minha senha</a>
    </div>
  </div>

  <footer class="text-center mt-4 text-muted small">
    MusemAdmin 2025 - Sobre o Software
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script  src="/js/login.js" type="text/javascript"></script>
</body>
</html>
