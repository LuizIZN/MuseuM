<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manutenções - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 id="user-greeting" class="fw-bold"></h4>
        <p class="text-muted">Gerencie manutenções registradas</p>
      </div>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalCadastrarManutencao">
        + Nova Manutenção
      </button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar manutenção...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>ID Técnico</th>
          <th>Código Item</th>
          <th>Nome do Técnico</th>
          <th>Data</th>
          <th>Valor (R$)</th>
          <th>Descrição</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-manutencoes"></tbody>
    </table>

    <nav class="d-flex justify-content-center mt-4">
      <ul class="pagination pagination-sm">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">Próximo</a></li>
      </ul>
    </nav>
  </main>
</div>

<!-- MODAL Cadastrar Manutenção -->
<div class="modal fade" id="modalCadastrarManutencao" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Nova Manutenção</h5>
      <input id="new-id" class="form-control mb-2" placeholder="ID Técnico">
      <input id="new-item" class="form-control mb-2" placeholder="Código do Item">
      <input id="new-tecnico" class="form-control mb-2" placeholder="Nome do Técnico">
      <input id="new-data" class="form-control mb-2" placeholder="Data">
      <input id="new-valor" class="form-control mb-2" placeholder="Valor (R$)">
      <input id="new-descricao" class="form-control mb-3" placeholder="Descrição">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="salvarNovaManutencao()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL Editar Manutenção -->
<div class="modal fade" id="modalEditarManutencao" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Editar Manutenção</h5>
      <input id="edit-id" class="form-control mb-2" placeholder="ID Técnico">
      <input id="edit-item" class="form-control mb-2" placeholder="Código do Item">
      <input id="edit-tecnico" class="form-control mb-2" placeholder="Nome do Técnico">
      <input id="edit-data" class="form-control mb-2" placeholder="Data">
      <input id="edit-valor" class="form-control mb-2" placeholder="Valor (R$)">
      <input id="edit-descricao" class="form-control mb-3" placeholder="Descrição">
      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="salvarEdicao()">Salvar Alterações</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
<script src="js/manutencoes.js"></script>
</body>
</html>
