<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visitantes - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Gerenciar Visitantes</h4>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalNovoVisitante">+ Novo Visitante</button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar visitante...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Data</th>
          <th>Hora</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-visitantes"></tbody>
    </table>
  </main>
</div>

<!-- MODAL Cadastrar -->
<div class="modal fade" id="modalNovoVisitante" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Novo Visitante</h5>

      <select id="tipo-visitante" class="form-select mb-3" onchange="alternarCampos()">
        <option value="fisica">Pessoa Física</option>
        <option value="juridica">Pessoa Jurídica</option>
      </select>

      <div id="campos-fisica">
        <input id="cpf" class="form-control mb-2" placeholder="CPF" />
        <input id="nome" class="form-control mb-2" placeholder="Nome Completo" />
      </div>

      <div id="campos-juridica" class="d-none">
        <input id="cnpj" class="form-control mb-2" placeholder="CNPJ" />
        <input id="nomeFantasia" class="form-control mb-2" placeholder="Nome Fantasia" />
      </div>

      <input id="email" class="form-control mb-2" placeholder="Email" />
      <input id="telefone" class="form-control mb-2" placeholder="Telefone" />
      <input id="endereco" class="form-control mb-2" placeholder="Endereço" />
      <input id="data" type="date" class="form-control mb-2" />
      <input id="hora" type="time" class="form-control mb-3" />

      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="cadastrarVisitante()">Salvar Visitante</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
<script src="js/visitantes.js"></script>
</body>
</html>
