<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Empréstimos - MuseuM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="d-flex vh-100">
  <!-- Sidebar -->
  <aside class="bg-white border-end p-4 d-flex flex-column justify-content-between" style="width: 250px;">
    <div>
      <h4 class="fw-bold mb-4 text-center">Museu<span class="text-dark">M</span></h4>
      <p class="text-muted fw-semibold mb-2">Menu</p>
      <ul id="menu-list" class="nav flex-column gap-1"></ul>
    </div>
  </aside>

  <!-- Conteúdo principal -->
  <main class="flex-fill p-4 overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold">Gerenciar Empréstimos</h4>
      <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#modalNovoEmprestimo">+ Novo Empréstimo</button>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control" placeholder="🔍 Buscar empréstimo...">
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Item</th>
          <th>Data de Empréstimo</th>
          <th>Data de Devolução</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-emprestimos"></tbody>
    </table>
  </main>
</div>

<!-- Modal: Novo Empréstimo -->
<div class="modal fade" id="modalNovoEmprestimo" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4">
      <h5 class="modal-title mb-3">Novo Empréstimo</h5>

      <input id="emprestimo-codigo" class="form-control mb-2" placeholder="Código do Empréstimo" />

      <select id="emprestimo-item" class="form-select mb-2">
        <option value="">Selecione o item</option>
        <!-- Itens serão inseridos via JS -->
      </select>

      <input id="data-emprestimo" type="date" class="form-control mb-2" />
      <input id="data-devolucao" type="date" class="form-control mb-3" />

      <div class="text-end">
        <button class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" onclick="cadastrarEmprestimo()">Cadastrar Empréstimo</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
<script src="js/emprestimos.js"></script>
</body>
</html>
